name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Configurar Java (JDK 21)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Instalar dependências
      run: npm install

    - name: Preparar arquivos web na pasta www
      run: |
        mkdir -p www
        cp index.html manifest.json sw.js www/
        cp *.png www/ || true  # O '|| true' impede que o build falhe se não houver PNGs na raiz

    - name: Adicionar plataforma Android
      run: npx cap add android

    - name: Gerar Ícones Nativos do Android
      run: npx capacitor-assets generate --android

    - name: Sincronizar arquivos web com o Android
      run: npx cap sync android

    - name: Compilar APK (Debug)
      working-directory: ./android
      run: ./gradlew assembleDebug

    - name: Salvar APK como Artefato para Download
      uses: actions/upload-artifact@v4
      with:
        name: Minhas-Despesas-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7
