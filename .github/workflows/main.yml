name: Gerar APK Android

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependências
        run: npm install

      - name: Preparar arquivos web
        run: |
          mkdir -p www
          cp index.html www/
          cp manifest.json www/
          cp icon-192.png www/
          cp icon-512.png www/
          if [ -f service-worker.js ]; then cp service-worker.js www/; fi

      - name: Adicionar plataforma Android
        run: npx cap add android

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Aplicar ícone do app
        continue-on-error: true
        run: |
          if command -v convert >/dev/null 2>&1; then
            for pair in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
              name="${pair%%:*}"
              size="${pair##*:}"
              convert icon-512.png -resize "${size}x${size}" "android/app/src/main/res/mipmap-${name}/ic_launcher.png"
              convert icon-512.png -resize "${size}x${size}" "android/app/src/main/res/mipmap-${name}/ic_launcher_round.png"
            done
          fi

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Enviar APK pronto
        uses: actions/upload-artifact@v4
        with:
          name: minhas-despesas-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
