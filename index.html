<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#2457e6" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Despesas" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="manifest" href="manifest.json" />
  <title>Despesas Mensais</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f5fb;
      color: #182033;
    }

    .app {
      max-width: 480px;
      margin: 0 auto;
      padding: 16px;
      padding-bottom: 130px;
    }

    .card {
      background: #ffffff;
      border-radius: 16px;
      padding: 14px;
      box-shadow: 0 4px 16px rgba(20, 30, 60, 0.06);
      margin-bottom: 12px;
    }

    .month-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }

    .month-nav button {
      width: 44px;
      height: 44px;
      border: none;
      border-radius: 12px;
      background: #ffffff;
      font-size: 20px;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(20, 30, 60, 0.06);
    }

    .month-label {
      font-size: 18px;
      font-weight: bold;
      text-align: center;
    }

    .label {
      color: #6d7586;
      font-size: 12px;
      display: block;
      margin-bottom: 2px;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }

    .total-card {
      grid-column: span 2;
      margin-bottom: 0;
    }

    .total-card strong {
      display: block;
      font-size: 24px;
      margin-top: 2px;
    }

    .pago strong { color: #0f8a4b; }
    .pendente strong { color: #c25f2f; }

    .filters {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
    }
    .filters::-webkit-scrollbar { display: none; }

    .filter-btn {
      border: 1px solid #d8deea;
      background: #ffffff;
      color: #6d7586;
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
    }

    .filter-btn.active {
      background: #2457e6;
      color: #ffffff;
      border-color: #2457e6;
    }

    h2 {
      margin: 0 0 12px;
      font-size: 18px;
    }

    input, select, textarea {
      width: 100%;
      border: 1px solid #d8deea;
      border-radius: 12px;
      padding: 13px 14px;
      font-size: 16px;
      margin-bottom: 10px;
      background: #ffffff;
    }

    .campo-label {
      font-size: 13px;
      color: #6d7586;
      display: block;
      margin: 0 0 6px;
    }

    .recorrente-label {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      color: #3c465c;
      margin-bottom: 12px;
      cursor: pointer;
    }

    .recorrente-label input {
      width: 20px;
      height: 20px;
      margin: 0;
      accent-color: #2457e6;
    }

    button[type="submit"] {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 14px;
      background: #2457e6;
      color: #ffffff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #cancelBtn {
      width: 100%;
      border: 1px solid #d8deea;
      background: #ffffff;
      border-radius: 12px;
      padding: 12px;
      margin-top: 10px;
      font-size: 15px;
      cursor: pointer;
    }

    .item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #ffffff;
      border-radius: 16px;
      padding: 14px;
      box-shadow: 0 4px 16px rgba(20, 30, 60, 0.06);
      margin-bottom: 10px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .item:hover { background: #fafbfc; }
    .item.pago { background: #f0fbf4; }

    .item input[type="checkbox"] {
      width: 22px;
      height: 22px;
      margin: 0;
      accent-color: #0f8a4b;
      cursor: pointer;
      flex-shrink: 0;
    }

    .info { flex: 1; min-width: 0; }

    .nome {
      font-weight: bold;
      font-size: 17px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
      color: #182033;
    }

    .sub {
      font-size: 12px;
      color: #6d7586;
      margin-top: 3px;
    }

    .sub.atrasado {
      color: #c23b3b;
      font-weight: bold;
    }

    .valor {
      font-weight: bold;
      white-space: nowrap;
      font-size: 16px;
      flex-shrink: 0;
      color: #182033;
    }

    .empty {
      text-align: center;
      color: #6d7586;
      padding: 24px 0;
    }

    .backup {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    .backup button {
      flex: 1;
      border: 1px solid #d8deea;
      background: #ffffff;
      border-radius: 12px;
      padding: 12px;
      font-size: 14px;
      cursor: pointer;
    }

    .fab {
      position: fixed;
      right: 20px;
      bottom: 90px;
      width: 60px;
      height: 60px;
      border: none;
      border-radius: 50%;
      background: #2457e6;
      color: #ffffff;
      font-size: 32px;
      line-height: 1;
      box-shadow: 0 8px 20px rgba(36, 87, 230, 0.35);
      z-index: 20;
      cursor: pointer;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 30;
    }

    .modal.active { display: flex; }

    .modal-content {
      background: #ffffff;
      width: 100%;
      max-width: 480px;
      border-radius: 20px 20px 0 0;
      padding: 20px 16px 24px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .custom-modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(15, 23, 42, 0.45);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
    .custom-modal-overlay.active { display: flex; }

    .custom-modal-box {
      background: #ffffff;
      padding: 24px;
      border-radius: 16px;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      text-align: center;
    }
    .custom-modal-box h3 {
      margin-top: 0;
      margin-bottom: 12px;
      color: #182033;
      font-size: 18px;
    }
    .custom-modal-box p {
      margin-bottom: 20px;
      color: #6d7586;
      font-size: 14px;
      line-height: 1.4;
    }
    .custom-modal-buttons {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .custom-modal-buttons button {
      padding: 12px 16px;
      border: none;
      border-radius: 12px;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
      width: 100%;
    }
    .btn-primary { background-color: #2457e6; color: #ffffff; }
    .btn-secondary { background-color: #e5e7eb; color: #182033; }
    .btn-danger { background-color: #dc2626; color: #ffffff; }

    /* Acessibilidade: foco visível */
    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    textarea:focus-visible {
      outline: 3px solid #2457e6;
      outline-offset: 2px;
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="month-nav">
      <button id="prevMonth" type="button" aria-label="Mês anterior">←</button>
      <div class="month-label" id="monthLabel"></div>
      <button id="nextMonth" type="button" aria-label="Próximo mês">→</button>
    </div>

    <div class="summary-grid">
      <div class="card total-card">
        <span class="label">Total do mês</span>
        <strong id="totalMes">R$ 0,00</strong>
      </div>

      <div class="card pago">
        <span class="label">Pago</span>
        <strong id="totalPago">R$ 0,00</strong>
      </div>

      <div class="card pendente">
        <span class="label">Faltando</span>
        <strong id="totalPendente">R$ 0,00</strong>
      </div>
    </div>

    <div class="filters">
      <button class="filter-btn active" data-filter="todos" type="button">Todos</button>
      <button class="filter-btn" data-filter="pendentes" type="button">Pendentes</button>
      <button class="filter-btn" data-filter="pagos" type="button">Pagos</button>
    </div>

    <div id="lista"></div>

    <div class="backup">
      <button id="exportar" type="button">Exportar backup</button>
      <button id="importar" type="button">Importar backup</button>
      <input id="arquivoBackup" type="file" accept=".json" hidden />
    </div>
  </div>

  <button id="fabAdd" class="fab" type="button" aria-label="Adicionar item">+</button>

  <div id="modal" class="modal">
    <div class="modal-content" role="dialog" aria-modal="true">
      <form id="form">
        <h2 id="formTitle">Novo item</h2>

        <input id="nome" type="text" placeholder="Ex.: Aluguel, energia, mercado..." required autocomplete="off" enterkeyhint="next" />
        <input id="valor" type="number" inputmode="decimal" step="0.01" min="0" placeholder="Valor" required />

        <label class="campo-label" for="categoria">Categoria</label>
        <select id="categoria">
          <option value="moradia">Moradia</option>
          <option value="alimentacao">Alimentação</option>
          <option value="transporte">Transporte</option>
          <option value="lazer">Lazer</option>
          <option value="saude">Saúde</option>
          <option value="outros" selected>Outros</option>
        </select>

        <label class="campo-label" for="vencimento">Data de vencimento (opcional)</label>
        <input id="vencimento" type="date" />

        <label class="recorrente-label">
          <input id="recorrente" type="checkbox" />
          Repetir este item todo mês
        </label>

        <button id="submitBtn" type="submit">Adicionar item</button>
        <button id="cancelBtn" type="button">Cancelar</button>
      </form>
    </div>
  </div>

  <!-- Modal Escolha de Mês -->
  <div id="custom-modal" class="custom-modal-overlay">
    <div class="custom-modal-box">
      <h3 id="modal-title">Alterar valor da despesa</h3>
      <p id="modal-message">Deseja alterar o valor apenas para este mês ou para todos os meses?</p>
      <div class="custom-modal-buttons">
        <button id="btn-single-month" class="btn-primary" type="button">Apenas este mês</button>
        <button id="btn-all-months" class="btn-secondary" type="button">Todos os meses</button>
      </div>
    </div>
  </div>

  <!-- Modal Opções do Item -->
  <div id="options-modal" class="custom-modal-overlay">
    <div class="custom-modal-box">
      <h3 id="options-modal-title">Opções do Item</h3>
      <p id="options-modal-message">Escolha uma ação para este item:</p>
      <div class="custom-modal-buttons">
        <button id="btn-option-edit" class="btn-primary" type="button">Editar</button>
        <button id="btn-option-delete" class="btn-danger" type="button">Excluir</button>
        <button id="btn-option-cancel" class="btn-secondary" type="button">Cancelar</button>
      </div>
    </div>
  </div>

  <!-- Modal Genérico de Alerta -->
  <div id="alert-modal" class="custom-modal-overlay">
    <div class="custom-modal-box">
      <h3 id="alert-title">Aviso</h3>
      <p id="alert-message"></p>
      <div class="custom-modal-buttons">
        <button id="btn-alert-ok" class="btn-primary" type="button">OK</button>
      </div>
    </div>
  </div>

  <!-- Modal Genérico de Confirmação -->
  <div id="confirm-modal" class="custom-modal-overlay">
    <div class="custom-modal-box">
      <h3 id="confirm-title">Confirmação</h3>
      <p id="confirm-message"></p>
      <div class="custom-modal-buttons">
        <button id="btn-confirm-ok" class="btn-primary" type="button">Confirmar</button>
        <button id="btn-confirm-cancel" class="btn-secondary" type="button">Cancelar</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "despesas-mensais";

    let currentDate = new Date();
    let currentYear = currentDate.getFullYear();
    let currentMonth = currentDate.getMonth();

    let currentFilter = "todos";
    let editingId = null;

    const CATEGORIAS_MAP = {
      moradia: { nome: "Moradia" },
      alimentacao: { nome: "Alimentação" },
      transporte: { nome: "Transporte" },
      lazer: { nome: "Lazer" },
      saude: { nome: "Saúde" },
      outros: { nome: "Outros" }
    };

    const form = document.getElementById("form");
    const formTitle = document.getElementById("formTitle");
    const nomeInput = document.getElementById("nome");
    const valorInput = document.getElementById("valor");
    const categoriaSelect = document.getElementById("categoria");
    const vencimentoInput = document.getElementById("vencimento");
    const recorrenteInput = document.getElementById("recorrente");
    const submitBtn = document.getElementById("submitBtn");
    const cancelBtn = document.getElementById("cancelBtn");
    const lista = document.getElementById("lista");

    const modal = document.getElementById("modal");
    const fabAdd = document.getElementById("fabAdd");

    const monthLabel = document.getElementById("monthLabel");
    const totalMesEl = document.getElementById("totalMes");
    const totalPagoEl = document.getElementById("totalPago");
    const totalPendenteEl = document.getElementById("totalPendente");

    const prevMonthBtn = document.getElementById("prevMonth");
    const nextMonthBtn = document.getElementById("nextMonth");

    const exportarBtn = document.getElementById("exportar");
    const importarBtn = document.getElementById("importar");
    const arquivoBackup = document.getElementById("arquivoBackup");
    const filterButtons = document.querySelectorAll(".filter-btn");

    // ---------- Utilitários ----------

    function getMonthKey(year, month) {
      return `${year}-${String(month + 1).padStart(2, "0")}`;
    }

    function todayKey() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, "0");
      const day = String(now.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function getMonthName(year, month) {
      const date = new Date(year, month, 1);
      const label = date.toLocaleDateString("pt-BR", {
        month: "long",
        year: "numeric"
      });
      return label.charAt(0).toUpperCase() + label.slice(1);
    }

    function formatDate(iso) {
      if (!iso || typeof iso !== "string" || iso.length < 10) return "";
      const partes = iso.split("-");
      if (partes.length !== 3) return "";
      return `${partes[2]}/${partes[1]}/${partes[0]}`;
    }

    function gerarId() {
      if (typeof crypto !== "undefined" && typeof crypto.randomUUID === "function") {
        return crypto.randomUUID();
      }
      return `${Date.now()}-${Math.random().toString(36).slice(2, 10)}`;
    }

    function migrateItem(item) {
      if (!item || typeof item !== "object") return null;
      if (!Array.isArray(item.pagos)) {
        item.pagos = item.pago ? [item.month] : [];
        delete item.pago;
      }
      if (typeof item.recorrente !== "boolean") item.recorrente = false;
      if (typeof item.vencimento !== "string") item.vencimento = "";
      if (!item.categoria || !CATEGORIAS_MAP[item.categoria]) item.categoria = "outros";
      if (!item.valoresPorMes || typeof item.valoresPorMes !== "object") item.valoresPorMes = {};
      if (!item.id) item.id = gerarId();
      if (typeof item.createdAt !== "number") item.createdAt = Date.now();
      if (!item.month && typeof item.month !== "string") item.month = "";
      if (typeof item.nome !== "string") item.nome = "Sem nome";
      if (typeof item.valor !== "number") item.valor = Number(item.valor) || 0;
      return item;
    }

    function loadItems() {
      try {
        const raw = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        if (!Array.isArray(raw)) return [];
        return raw.map(migrateItem).filter(Boolean);
      } catch {
        return [];
      }
    }

    function saveItems(items) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
    }

    function appearsInMonth(item, key) {
      return item.recorrente || item.month === key;
    }

    function effectiveDue(item, key) {
      if (!item.vencimento || item.vencimento.length < 10) return "";
      if (item.recorrente) {
        const diaOriginal = Number(item.vencimento.slice(8, 10));
        if (!Number.isFinite(diaOriginal)) return "";
        const [ano, mes] = key.split("-").map(Number);
        const ultimoDia = new Date(ano, mes, 0).getDate();
        const dia = Math.min(diaOriginal, ultimoDia);
        return `${key}-${String(dia).padStart(2, "0")}`;
      }
      return item.vencimento;
    }

    function effectiveValor(item, key) {
      if (item.valoresPorMes?.[key] !== undefined && item.valoresPorMes?.[key] !== null) {
        return Number(item.valoresPorMes[key]);
      }
      return Number(item.valor);
    }

    function formatCurrency(value) {
      return value.toLocaleString("pt-BR", {
        style: "currency",
        currency: "BRL"
      });
    }

    function escapeHtml(text) {
      return String(text).replace(/[&<>"']/g, function (char) {
        const map = {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        };
        return map[char];
      });
    }

    // ---------- Modais genéricos ----------

    function mostrarAlerta(mensagem, titulo = "Aviso") {
      return new Promise((resolve) => {
        const alertModal = document.getElementById("alert-modal");
        const titleEl = document.getElementById("alert-title");
        const msgEl = document.getElementById("alert-message");
        const btnOk = document.getElementById("btn-alert-ok");

        titleEl.textContent = titulo;
        msgEl.textContent = mensagem;
        alertModal.classList.add("active");

        const handleOk = () => {
          alertModal.classList.remove("active");
          btnOk.removeEventListener("click", handleOk);
          resolve();
        };
        btnOk.addEventListener("click", handleOk);
      });
    }

    function mostrarConfirmacao(mensagem, titulo = "Confirmação") {
      return new Promise((resolve) => {
        const confirmModal = document.getElementById("confirm-modal");
        const titleEl = document.getElementById("confirm-title");
        const msgEl = document.getElementById("confirm-message");
        const btnOk = document.getElementById("btn-confirm-ok");
        const btnCancel = document.getElementById("btn-confirm-cancel");

        titleEl.textContent = titulo;
        msgEl.textContent = mensagem;
        confirmModal.classList.add("active");

        const cleanup = () => {
          confirmModal.classList.remove("active");
          btnOk.removeEventListener("click", handleOk);
          btnCancel.removeEventListener("click", handleCancel);
        };
        const handleOk = () => { cleanup(); resolve(true); };
        const handleCancel = () => { cleanup(); resolve(false); };

        btnOk.addEventListener("click", handleOk);
        btnCancel.addEventListener("click", handleCancel);
      });
    }

    function mostrarModalEscolhaMes(mensagem) {
      return new Promise((resolve) => {
        const customModal = document.getElementById("custom-modal");
        const msgEl = document.getElementById("modal-message");
        const btnSingle = document.getElementById("btn-single-month");
        const btnAll = document.getElementById("btn-all-months");

        msgEl.textContent = mensagem || "Deseja alterar o valor apenas para este mês ou para todos os meses?";
        customModal.classList.add("active");

        const handleSingle = () => { cleanup(); resolve(true); };
        const handleAll = () => { cleanup(); resolve(false); };

        function cleanup() {
          customModal.classList.remove("active");
          btnSingle.removeEventListener("click", handleSingle);
          btnAll.removeEventListener("click", handleAll);
        }

        btnSingle.addEventListener("click", handleSingle);
        btnAll.addEventListener("click", handleAll);
      });
    }

    function mostrarModalOpcoesItem(nomeItem) {
      return new Promise((resolve) => {
        const optionsModal = document.getElementById("options-modal");
        const titleEl = document.getElementById("options-modal-title");
        const btnEdit = document.getElementById("btn-option-edit");
        const btnDelete = document.getElementById("btn-option-delete");
        const btnCancel = document.getElementById("btn-option-cancel");

        titleEl.textContent = `Opções para "${nomeItem}"`;
        optionsModal.classList.add("active");

        const handleEdit = () => { cleanup(); resolve("editar"); };
        const handleDelete = () => { cleanup(); resolve("excluir"); };
        const handleCancel = () => { cleanup(); resolve("cancelar"); };

        function cleanup() {
          optionsModal.classList.remove("active");
          btnEdit.removeEventListener("click", handleEdit);
          btnDelete.removeEventListener("click", handleDelete);
          btnCancel.removeEventListener("click", handleCancel);
        }

        btnEdit.addEventListener("click", handleEdit);
        btnDelete.addEventListener("click", handleDelete);
        btnCancel.addEventListener("click", handleCancel);
      });
    }

    // ---------- Formulário principal ----------

    function openModal() {
      modal.classList.add("active");
    }

    function resetForm() {
      editingId = null;
      form.reset();
      categoriaSelect.value = "outros";
      formTitle.textContent = "Novo item";
      submitBtn.textContent = "Adicionar item";
    }

    function closeModal() {
      modal.classList.remove("active");
      resetForm();
    }

    function startEdit(id) {
      const key = getMonthKey(currentYear, currentMonth);
      const item = loadItems().find(currentItem => currentItem.id === id);
      if (!item) return;

      editingId = id;
      nomeInput.value = item.nome;
      valorInput.value = effectiveValor(item, key);
      categoriaSelect.value = item.categoria || "outros";
      vencimentoInput.value = item.vencimento || "";
      recorrenteInput.checked = item.recorrente;

      formTitle.textContent = "Editar item";
      submitBtn.textContent = "Salvar alterações";

      openModal();
      nomeInput.focus();
    }

    // ---------- Renderização ----------

    function render() {
      const key = getMonthKey(currentYear, currentMonth);
      const hoje = todayKey();

      const allMonthItems = loadItems().filter(item => appearsInMonth(item, key));

      const items = allMonthItems.filter(item => {
        const paid = item.pagos.includes(key);
        if (currentFilter === "pendentes") return !paid;
        if (currentFilter === "pagos") return paid;
        return true;
      }).sort((a, b) => {
        const dueA = effectiveDue(a, key) || "9999-99-99";
        const dueB = effectiveDue(b, key) || "9999-99-99";
        if (dueA === dueB) return (a.createdAt || 0) - (b.createdAt || 0);
        return dueA < dueB ? -1 : 1;
      });

      monthLabel.textContent = getMonthName(currentYear, currentMonth);

      const totalMes = allMonthItems.reduce((sum, item) => sum + effectiveValor(item, key), 0);
      const totalPago = allMonthItems
        .filter(item => item.pagos.includes(key))
        .reduce((sum, item) => sum + effectiveValor(item, key), 0);
      const totalPendente = totalMes - totalPago;

      totalMesEl.textContent = formatCurrency(totalMes);
      totalPagoEl.textContent = formatCurrency(totalPago);
      totalPendenteEl.textContent = formatCurrency(totalPendente);

      lista.innerHTML = "";

      if (items.length === 0) {
        lista.innerHTML = `<div class="empty">Nenhum item encontrado neste filtro.</div>`;
        return;
      }

      items.forEach(item => {
        const paid = item.pagos.includes(key);
        const due = effectiveDue(item, key);
        const overdue = !paid && due !== "" && due < hoje;
        const valor = effectiveValor(item, key);

        let subText;
        if (overdue) {
          subText = `Atrasado · ${formatDate(due)}`;
        } else if (due !== "") {
          subText = `${formatDate(due)} · ${paid ? "Pago" : "Pendente"}`;
        } else {
          subText = paid ? "Pago" : "Pendente";
        }

        const itemEl = document.createElement("div");
        itemEl.className = `item ${paid ? "pago" : ""}`;

        itemEl.innerHTML = `
          <input type="checkbox" class="check" ${paid ? "checked" : ""} aria-label="Marcar como pago" />
          <div class="info">
            <div class="nome">${escapeHtml(item.nome)}</div>
            <div class="sub ${overdue ? "atrasado" : ""}">${escapeHtml(subText)}</div>
          </div>
          <div class="valor">${formatCurrency(valor)}</div>
        `;

        const checkbox = itemEl.querySelector(".check");
        checkbox.addEventListener("click", (e) => e.stopPropagation());
        checkbox.addEventListener("change", () => togglePago(item.id));

        itemEl.addEventListener("click", async () => {
          const acao = await mostrarModalOpcoesItem(item.nome);
          if (acao === "editar") startEdit(item.id);
          else if (acao === "excluir") await removeItem(item.id);
        });

        lista.appendChild(itemEl);
      });
    }

    function togglePago(id) {
      const items = loadItems();
      const item = items.find(currentItem => currentItem.id === id);
      if (!item) return;

      const key = getMonthKey(currentYear, currentMonth);
      const index = item.pagos.indexOf(key);

      if (index >= 0) item.pagos.splice(index, 1);
      else item.pagos.push(key);

      saveItems(items);
      render();
    }

    async function removeItem(id) {
      const items = loadItems();
      const item = items.find(currentItem => currentItem.id === id);
      if (!item) return;

      const mensagem = item.recorrente
        ? "Este item se repete todo mês. Excluir de todos os meses?"
        : "Deseja excluir este item?";

      const confirmado = await mostrarConfirmacao(mensagem, "Excluir item");
      if (!confirmado) return;

      saveItems(items.filter(currentItem => currentItem.id !== id));
      render();
    }

    // ---------- Eventos ----------

    fabAdd.addEventListener("click", () => {
      resetForm();
      openModal();
      nomeInput.focus();
    });

    cancelBtn.addEventListener("click", closeModal);

    modal.addEventListener("click", (event) => {
      if (event.target === modal) closeModal();
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && modal.classList.contains("active")) closeModal();
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const nome = nomeInput.value.trim();
      const valor = parseFloat(valorInput.value);
      const categoria = categoriaSelect.value;

      if (!nome || isNaN(valor) || valor <= 0) {
        await mostrarAlerta("Informe um nome e um valor válidos.", "Dados inválidos");
        return;
      }

      const items = loadItems();
      const key = getMonthKey(currentYear, currentMonth);

      if (editingId === null) {
        items.push({
          id: gerarId(),
          nome,
          valor,
          categoria,
          vencimento: vencimentoInput.value,
          recorrente: recorrenteInput.checked,
          month: key,
          pagos: [],
          valoresPorMes: {},
          createdAt: Date.now()
        });
      } else {
        const item = items.find(currentItem => currentItem.id === editingId);
        if (item) {
          item.nome = nome;
          item.categoria = categoria;
          item.vencimento = vencimentoInput.value;
          item.recorrente = recorrenteInput.checked;

          if (item.recorrente) {
            const soEsteMes = await mostrarModalEscolhaMes(
              `Alterar o valor apenas em ${getMonthName(currentYear, currentMonth)}?`
            );

            if (soEsteMes) {
              item.valoresPorMes[key] = valor;
            } else {
              item.valor = valor;
              item.valoresPorMes = {}; // Limpa overrides anteriores
            }
          } else {
            item.valor = valor;
            delete item.valoresPorMes[key];
          }
        }
      }

      saveItems(items);
      closeModal();
      render();
    });

    prevMonthBtn.addEventListener("click", () => {
      currentMonth--;
      if (currentMonth < 0) { currentMonth = 11; currentYear--; }
      render();
    });

    nextMonthBtn.addEventListener("click", () => {
      currentMonth++;
      if (currentMonth > 11) { currentMonth = 0; currentYear++; }
      render();
    });

    filterButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        filterButtons.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentFilter = btn.dataset.filter;
        render();
      });
    });

    // ---------- Exportação Automática ----------

    exportarBtn.addEventListener("click", () => {
      const dados = localStorage.getItem(STORAGE_KEY) || "[]";
      
      // Cria o arquivo JSON
      const blob = new Blob([dados], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      
      // Cria um link invisível para forçar o download
      const a = document.createElement("a");
      a.href = url;
      
      // Define o nome do arquivo com a data do dia
      const dataAtual = new Date().toISOString().slice(0, 10);
      a.download = `backup-despesas-${dataAtual}.json`;
      
      document.body.appendChild(a);
      a.click();
      
      // Limpa a memória depois do download
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });

    // ---------- Importação ----------

    importarBtn.addEventListener("click", () => arquivoBackup.click());

    arquivoBackup.addEventListener("change", () => {
      const file = arquivoBackup.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = async function () {
        try {
          const parsed = JSON.parse(reader.result);
          if (!Array.isArray(parsed)) throw new Error("Formato inválido");

          const itensValidos = parsed
            .filter(i => i && typeof i === "object" && typeof i.nome === "string")
            .map(migrateItem)
            .filter(Boolean);

          if (itensValidos.length === 0 && parsed.length > 0) {
            throw new Error("Nenhum item válido no backup");
          }

          const confirmado = await mostrarConfirmacao(
            "Importar o backup substitui os itens atuais. Continuar?",
            "Importar backup"
          );

          if (confirmado) {
            saveItems(itensValidos);
            render();
            await mostrarAlerta("Backup importado com sucesso!", "Sucesso");
          }
        } catch {
          await mostrarAlerta("Arquivo de backup inválido.", "Erro");
        }
      };
      reader.readAsText(file);
      arquivoBackup.value = "";
    });

    // ---------- Service Worker (PWA) ----------

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(() => {});
      });
    }

    render();
  </script>
</body>
</html>
